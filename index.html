<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ================= AUTH PAGE ================= -->
    <div class="auth-page" id="authPage">
        <div class="auth-container">
            <div class="auth-box">
                <h1 id="authTitle">Welcome Back 👋</h1>

                <form id="authForm" novalidate>
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" placeholder="Enter your username" maxlength="20" autocomplete="username">
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="pw-wrap">
                            <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password">
                            <button type="button" class="pw-toggle" id="pwToggle">Show</button>
                        </div>
                        <span class="password-hint" id="pwHint" hidden>At least 6 characters</span>
                        <div class="strength" id="strength" hidden><i id="strengthBar"></i></div>
                    </div>

                    <div class="form-group" id="confirmGroup" hidden>
                        <label for="confirmPassword">Confirm Password</label>
                        <input type="password" id="confirmPassword" placeholder="Re-enter your password" autocomplete="new-password">
                    </div>

                    <label class="remember">
                        <input type="checkbox" id="remember" checked> Keep me logged in
                    </label>

                    <button type="submit" class="btn-primary" id="submitBtn">Login</button>

                    <div class="error-message" id="errorMessage" role="alert"></div>
                </form>

                <p class="toggle-auth">
                    <span id="toggleText">Don't have an account?</span>
                    <span class="link" id="toggleLink">Sign up</span>
                </p>
            </div>
        </div>
    </div>

    <!-- ================= DASHBOARD ================= -->
    <div class="dashboard" id="dashboard" hidden>
        <nav class="navbar">
            <div class="navbar-brand">🔐 MyApp</div>
            <button class="btn-logout" id="logoutBtn">Logout</button>
        </nav>

        <div class="dashboard-container">
            <div class="welcome-box">
                <h1 id="welcomeTitle"></h1>
                <p>You are successfully logged in.</p>
                <div class="clock" id="clock"></div>
            </div>

            <div class="info-cards">
                <div class="card">
                    <h3>👤 Account</h3>
                    <p>Username: <b id="infoUser"></b><br>
                       Member since: <b id="infoSince"></b></p>
                </div>
                <div class="card">
                    <h3>🕒 Activity</h3>
                    <p>Last login: <b id="infoLast"></b><br>
                       Total logins: <b id="infoCount"></b></p>
                </div>
                <div class="card">
                    <h3>🔒 Security</h3>
                    <p>Your password is stored as a salted SHA-256 hash, never as plain text.<br>
                       Session: <b id="infoSession"></b></p>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
